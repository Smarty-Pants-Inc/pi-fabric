name: Set up pinned Bun
description: Cache, verify, and install Bun 1.4.4 for supported runners.
runs:
  using: composite
  steps:
    - name: Select pinned Bun archive
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        # oven-sh/bun bun-v1.4.4 SHASUMS256.txt
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            asset=bun-linux-x64.zip
            sha=bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
            ;;
          Linux/ARM64)
            asset=bun-linux-aarch64.zip
            sha=baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e
            ;;
          macOS/ARM64)
            asset=bun-darwin-aarch64.zip
            sha=c240d7f0ccb90c263a849fcdb09b7ee62630d921348ed6aafda86b9d577bc510
            ;;
          macOS/X64)
            asset=bun-darwin-x64.zip
            sha=50a3491f73abc2fe81673171a85762d3bc2cc1680ccecadd983de99adf77977e
            ;;
          Windows/X64)
            asset=bun-windows-x64.zip
            sha=cd2c0fccc78f3ede1f50ca827a15f063eda13d4d150a3d0674f4f6e323d864a5
            ;;
          *)
            echo "::error::Unsupported Bun runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        runner_temp="$RUNNER_TEMP"
        if [[ "$RUNNER_OS" == Windows ]]; then
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
        fi
        cache_dir="$runner_temp/bun-archives/$sha"
        mkdir -p "$cache_dir"
        cache_dir_output="$cache_dir"
        if [[ "$RUNNER_OS" == Windows ]]; then
          cache_dir_output=$(cygpath -w "$cache_dir")
        fi
        printf 'asset=%s\nsha=%s\ncache_dir=%s\n' "$asset" "$sha" "$cache_dir_output" >> "$GITHUB_OUTPUT"
    - name: Cache pinned Bun archive
      uses: actions/cache@v4
      with:
        path: ${{ steps.pin.outputs.cache_dir }}/${{ steps.pin.outputs.asset }}
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.sha }}
    - name: Download missing Bun archive
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUN_ASSET: ${{ steps.pin.outputs.asset }}
        BUN_CACHE_DIR: ${{ steps.pin.outputs.cache_dir }}
      run: |
        set -euo pipefail
        cache_dir="$BUN_CACHE_DIR"
        if [[ "$RUNNER_OS" == Windows ]]; then
          cache_dir=$(cygpath -u "$BUN_CACHE_DIR")
        fi
        if [[ ! -f "$cache_dir/$BUN_ASSET" ]]; then
          gh release download -R oven-sh/bun bun-v1.4.4 -p "$BUN_ASSET" -D "$cache_dir"
        fi
    - name: Verify and install Bun
      shell: bash
      env:
        BUN_ASSET: ${{ steps.pin.outputs.asset }}
        BUN_SHA: ${{ steps.pin.outputs.sha }}
        BUN_CACHE_DIR: ${{ steps.pin.outputs.cache_dir }}
      run: |
        set -euo pipefail
        cache_dir="$BUN_CACHE_DIR"
        runner_temp="$RUNNER_TEMP"
        if [[ "$RUNNER_OS" == Windows ]]; then
          cache_dir=$(cygpath -u "$BUN_CACHE_DIR")
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
        fi
        cd "$cache_dir"
        if command -v sha256sum >/dev/null 2>&1; then
          printf '%s  %s\n' "$BUN_SHA" "$BUN_ASSET" | sha256sum -c -
        elif [[ "$RUNNER_OS" == macOS ]] && command -v shasum >/dev/null 2>&1; then
          printf '%s  %s\n' "$BUN_SHA" "$BUN_ASSET" | shasum -a 256 -c -
        else
          echo "::error::No supported SHA-256 utility found on $RUNNER_OS" >&2
          exit 1
        fi
        install_dir=$(mktemp -d "$runner_temp/bun-1.4.4.XXXXXX")
        unzip -q "$BUN_ASSET" -d "$install_dir"
        bin_dir="$install_dir/${BUN_ASSET%.zip}"
        binary=bun
        if [[ "$RUNNER_OS" == Windows ]]; then
          binary=bun.exe
        else
          chmod +x "$bin_dir/$binary"
        fi
        version=$("$bin_dir/$binary" --version)
        if [[ "$version" != 1.4.4 ]]; then
          echo "::error::Expected Bun 1.4.4, got: $version" >&2
          exit 1
        fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          cp "$bin_dir/$binary" "$bin_dir/bunx.exe"
          bunx="$bin_dir/bunx.exe"
        else
          ln -s bun "$bin_dir/bunx"
          bunx="$bin_dir/bunx"
        fi
        bunx_version=$("$bunx" --version)
        if [[ "$bunx_version" != 1.4.4 ]]; then
          echo "::error::Expected bunx 1.4.4, got: $bunx_version" >&2
          exit 1
        fi
        path_entry="$bin_dir"
        if [[ "$RUNNER_OS" == Windows ]]; then
          path_entry=$(cygpath -w "$bin_dir")
        fi
        printf '%s\n' "$path_entry" >> "$GITHUB_PATH"
