name: Entropy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  certify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: smarty-linux-x64
    timeout-minutes: 30
    steps:
      - name: Install Forge base prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git unzip
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Certify entropy
        run: node scripts/certify-entropy.mjs --json entropy-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entropy-report
          path: entropy-report.json
          retention-days: 3 # smarty-dev#1246
