name: 'FIFO probe full linux-tests (fabric-store, temporary; #2017)'
'on':
  push:
    branches:
    - fabric-store/fifo-probe-*
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ${{ vars.PI_FABRIC_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      FABRIC_TEST_SKIP_NATS: '1'
      PI_TEST_BASE: 0596428c6af820d99728f816b81b21fe8df4a42a
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/check-setup
      with:
        runner-environment: ${{ (vars.PI_FABRIC_LINUX_RUNNER || 'ubuntu-latest') == 'ubuntu-latest' && 'github-hosted' || 'self-hosted' }}
    - uses: ./.github/actions/check-systemd
    - name: Install pinned Bend proof compiler
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh release download -R bendlang/bend v2.0.36 -p bend-2.0.36-linux-x64.tar.gz -D "$RUNNER_TEMP"

        mv "$RUNNER_TEMP/bend-2.0.36-linux-x64.tar.gz" "$RUNNER_TEMP/bend.tar.gz"

        echo "02089dc0eed0fd5fd6d73c74cc9cffcb2c6638dd3b02ae83f7b8cc57fbe381ba  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"

        '
    - name: Check proofs, reproduce executable kernels, and reject invalid mutations
      env:
        BEND_NO_TELEMETRY: '1'
      run: bun run proof:check
    - name: Type check
      run: bun run typecheck
    - name: Fetch the pinned native toolchain
      run: node scripts/native-toolchain.mjs fetch
    - name: Build
      env:
        FABRIC_NATIVE_CC_PINNED: '1'
      run: bun run build
    - name: Archive gated build
      shell: bash
      run: 'printf ''%s\n'' "$GITHUB_SHA" > dist/.gated-source-sha

        tar -cf "$RUNNER_TEMP/dist.tar" dist

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dist-ubuntu-latest
        path: ${{ runner.temp }}/dist.tar
        if-no-files-found: error
        retention-days: 1
    - name: Run Linux tests in eight logged parallel lanes
      shell: bash
      run: "set -uo pipefail\nlane_root=\"$RUNNER_TEMP/linux-lanes\"\nreport_root=\"$RUNNER_TEMP/affected\"\nmkdir -p \"$lane_root\" \"$report_root\"\nlane_pids=()\ndeclare -A lane_names_by_pid=()\nfailed=0\n# ubuntu-latest public runners have 4 vCPU / 16 GB; cap active lanes at four.\nmax_lanes=4\nreap_lane() {\n  local finished_pid=\"\"\n  if wait -n -p finished_pid \"${lane_pids[@]}\"; then\n    echo \"${lane_names_by_pid[$finished_pid]}: PASS\"\n  else\n    echo \"${lane_names_by_pid[$finished_pid]}: FAIL\"\n    failed=1\n  fi\n  unset 'lane_names_by_pid[$finished_pid]'\n  local remaining_pids=()\n  for pid in \"${lane_pids[@]}\"; do\n    if [ \"$pid\" != \"$finished_pid\" ]; then remaining_pids+=(\"$pid\"); fi\n  done\n  lane_pids=(\"${remaining_pids[@]}\")\n}\nstart_lane() {\n  local lane=\"$1\"\n  while [ \"${#lane_pids[@]}\" -ge \"$max_lanes\" ]; do\n    reap_lane\n  done\n  (\n    mkdir -p \"$lane_root/$lane\"\n    lane_status=0\n    run_logged() {\n      local label=\"$1\"\n      shift\n      local log=\"$lane_root/$lane/$label.log\"\n      local code=0\n      if \"$@\" > \"$log\" 2>&1; then\n        code=0\n      else\n        code=$?\n      fi\n      echo \"::group::$lane / $label\"\n      cat \"$log\"\n      echo \"::endgroup::\"\n      printf '%s: exit %s\\n' \"$label\" \"$code\"\n      if [ \"$code\" -ne 0 ]; then lane_status=1; fi\n    }\n    run_advisory_logged() {\n      local label=\"$1\"\n      shift\n      local log=\"$lane_root/$lane/$label.log\"\n      local code=0\n      if \"$@\" > \"$log\" 2>&1; then\n        code=0\n      else\n        code=$?\n      fi\n      echo \"::group::$lane / $label (non-fatal)\"\n      cat \"$log\"\n      echo \"::endgroup::\"\n      printf '%s: exit %s (non-fatal)\\n' \"$label\" \"$code\"\n      if [ \"$code\" -ne 0 ]; then\n        echo \"::warning::Mesh lock benchmark ratchet failed with exit $code; this non-fatal lane will not fail linux-tests.\"\n      fi\n      if [ -n \"${GITHUB_STEP_SUMMARY:-}\" ]; then\n        {\n          printf '### Mesh lock benchmark (non-fatal)\\n\\n'\n          if [ \"$code\" -eq 0 ]; then\n            printf 'Result: **PASS**.\\n\\n'\n          else\n            printf 'Result: **FAIL** (exit `%s`); `linux-tests` continues.\\n\\n' \"$code\"\n          fi\n          printf 'Log: `%s`\\n' \"$log\"\n        } >> \"$GITHUB_STEP_SUMMARY\"\n      fi\n      return 0\n    }\n    case \"$lane\" in\n      affected-1-2)\n        run_logged shard-1 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-1\" bun run test:affected --shard=1/10\n        run_logged shard-2 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-2\" bun run test:affected --shard=2/10\n        ;;\n      affected-3-4)\n        run_logged shard-3 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-3\" bun run test:affected --shard=3/10\n        run_logged shard-4 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-4\" bun run test:affected --shard=4/10\n        ;;\n      affected-5-6)\n        run_logged shard-5 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-5\" bun run test:affected --shard=5/10\n        run_logged shard-6 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-6\" bun run test:affected --shard=6/10\n        ;;\n      affected-7-8)\n        run_logged shard-7 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-7\" bun run test:affected --shard=7/10\n        run_logged shard-8 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-8\" bun run test:affected --shard=8/10\n        ;;\n      affected-9-10)\n        run_logged shard-9 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-9\" bun run test:affected --shard=9/10\n        run_logged shard-10 env PI_TEST_REPORT_DIR=\"$report_root/affected-ubuntu-latest-10\" bun run test:affected --shard=10/10\n        ;;\n      acceptance-core)\n        run_logged session-channel env PI_FABRIC_REQUIRE_NATS=1 NATS_EXPECTED_SERVER_VERSION=2.14.7 bunx vitest\
        \ run --retry=0 tests/nats-session-channel.test.ts\n        run_logged package-install bun run smoke:package-install\n        run_logged ci-workflows bunx vitest run tests/ci-workflows.test.ts tests/ci-test-counts.test.ts\n        run_logged kernel-errors bunx vitest run tests/kernel-errors.test.ts\n        ;;\n      acceptance-runtime)\n        run_logged verified-kernels bunx vitest run tests/verified-kernels.test.ts tests/verified-resources.test.ts tests/verified-providers.test.ts tests/verified-authority.test.ts tests/verified-lifecycle.test.ts tests/verified-storage.test.ts tests/verified-artifact.test.ts\n        run_logged verified-dist bun run proof:dist\n        run_logged launcher-regressions bunx vitest run tests/worker-e2e.test.ts tests/pi-binary.test.ts tests/script-runtime.test.ts tests/herdr-transport.test.ts tests/prewalk-handoff.test.ts tests/shell-middleware.test.ts\n        run_logged provider-dead env FABRIC_8742_REAL_PI=1 bunx vitest run tests/main-provider-dead-real-pi.test.ts\n        run_logged extension-hidden-tools env FABRIC_5492_REAL_PI=1 bunx vitest run tests/extension-hidden-tools-real-pi.test.ts\n        run_logged sender-headers env FABRIC_6207_REAL_PI=1 bunx vitest run tests/sender-headers-real-pi.test.ts\n        ;;\n      runtime-bench)\n        run_logged platform-smoke bun run test:smoke\n        run_logged scope-e2e env FABRIC_SCOPE_E2E_REQUIRED=1 bunx vitest run --project scope-e2e\n        run_advisory_logged mesh-lock-bench bun run bench:mesh-lock:check --out mesh-lock.json\n        ;;\n      *) echo \"unknown lane: $lane\" >&2; exit 2 ;;\n    esac\n    exit \"$lane_status\"\n  ) &\n  lane_pids+=(\"$!\")\n  lane_names_by_pid[\"$!\"]=\"$lane\"\n}\nstart_lane affected-1-2\nstart_lane affected-3-4\nstart_lane affected-5-6\nstart_lane affected-7-8\nstart_lane affected-9-10\nstart_lane acceptance-core\nstart_lane acceptance-runtime\nstart_lane runtime-bench\nwhile [ \"${#lane_pids[@]}\" -gt 0 ]; do\n  reap_lane\ndone\nexit \"$failed\"\n"
    - name: Upload mesh lock benchmark result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mesh-lock-bench-${{ github.sha }}
        path: mesh-lock.json
        if-no-files-found: warn
        retention-days: 14
    - name: Upload affected-test receipt 1/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-1
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-1/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 2/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-2
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-2/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 3/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-3
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-3/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 4/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-4
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-4/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 5/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-5
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-5/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 6/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-6
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-6/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 7/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-7
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-7/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 8/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-8
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-8/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 9/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-9
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-9/
        if-no-files-found: error
        retention-days: 7
    - name: Upload affected-test receipt 10/10
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: affected-ubuntu-latest-10
        path: ${{ runner.temp }}/affected/affected-ubuntu-latest-10/
        if-no-files-found: error
        retention-days: 7
    - name: Package tested Linux runtime
      if: github.event_name == 'push'
      shell: bash
      run: 'stage="$RUNNER_TEMP/fabric-runtime"

        output="$RUNNER_TEMP/fabric-artifact"

        mkdir -p "$stage" "$output"

        git archive HEAD | tar -x -C "$stage"

        cp -a dist node_modules "$stage/"

        git rev-parse HEAD > "$output/COMMIT"

        git rev-parse HEAD^{tree} > "$output/TREE"

        node --version > "$output/NODE-VERSION"

        bun --version > "$output/BUN-VERSION"

        tar -czf "$output/fabric-runtime.tar.gz" -C "$stage" .

        (cd "$output" && sha256sum fabric-runtime.tar.gz > SHA256SUMS)

        '
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Real Pi exit cleanup e2e (smarty-dev#8467)
      timeout-minutes: 8
      env:
        FABRIC_8467_REAL_PI: '1'
      run: bunx vitest run tests/mesh-exit-cleanup-real-pi.e2e.test.ts
    - name: Upload tested Linux runtime
      if: github.event_name == 'push'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fabric-runtime-${{ github.sha }}
        path: ${{ runner.temp }}/fabric-artifact/
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
        - 3
