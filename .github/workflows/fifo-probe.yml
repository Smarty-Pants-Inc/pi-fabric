name: FIFO probe CI-set (fabric-store, temporary; #2017)
on:
  push:
    branches: ['fabric-store/fifo-probe-*']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    timeout-minutes: 75
    env:
      FABRIC_TEST_SKIP_NATS: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-setup
        with:
          runner-environment: github-hosted
      - uses: ./.github/actions/check-systemd
      - name: Fetch the pinned native toolchain
        run: node scripts/native-toolchain.mjs fetch
      - name: Build
        env:
          FABRIC_NATIVE_CC_PINNED: '1'
        run: bun run build
      - name: CI affected set (#2017 vs 0596428c) + agents-provider in one vitest run
        shell: bash
        run: |
          set -u
          files=$(for f in $(cat .github/fifo-probe-files.txt) tests/agents-provider.test.ts; do [ -f "$f" ] && echo "$f"; done)
          echo "files: $(echo "$files" | wc -l)"
          bunx vitest run $files > "$RUNNER_TEMP/set.log" 2>&1; rc=$?
          grep -E "FAIL .*agents-provider|admits queued workers in FIFO" "$RUNNER_TEMP/set.log" | head -5
          grep -E "^ *(Test Files|Tests) " "$RUNNER_TEMP/set.log" | tail -2
          grep -E " FAIL " "$RUNNER_TEMP/set.log" | sort -u | head -20
          echo "RESULT tree=$(git rev-parse HEAD) rep=${{ matrix.rep }} rc=$rc fifo_fail=$(grep -c 'FAIL .*FIFO order' "$RUNNER_TEMP/set.log")"
