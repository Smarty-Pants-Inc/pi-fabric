name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "v2-base/**"]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # The affected-test selection diffs the push range or the pull-request
          # base, so that base commit has to be present in history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install runtime prerequisites
        # pi's grep tool downloads rg on first use when it is absent; on shared
        # runners that ad-hoc GitHub Releases download is rate-limited, so
        # provision rg on PATH up front to keep nested-grep tests hermetic.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Non-login Git Bash children warn on stderr when its /tmp is absent.
            # Keep command output deterministic without stripping real warnings.
            mkdir -p /tmp
            choco install ripgrep -y --no-progress
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep bubblewrap python3
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prove kernels, refuse broken variants, and reproduce executable kernels
        if: runner.os == 'Linux'
        run: bun run proof:check
      - name: Type check
        run: bun run typecheck
      # Some integration tests execute the published worker entrypoints in dist.
      - name: Build
        run: bun run build
      # Keep the same unconditional cross-platform checks, but pay Vitest's
      # collection/worker startup once instead of three times.
      - name: Check CI, Python diagnostics, and verified-kernel ABI
        run: bunx vitest run tests/ci-workflows.test.ts tests/kernel-errors.test.ts tests/verified-kernels.test.ts tests/verified-resources.test.ts tests/verified-providers.test.ts tests/verified-authority.test.ts tests/verified-lifecycle.test.ts tests/verified-storage.test.ts tests/verified-grants.test.ts tests/verified-speculation.test.ts tests/verified-budget.test.ts tests/verified-artifact.test.ts tests/verified-proof-scope.test.ts tests/verified-kernel-pool.test.ts
      - name: Check bundled verified-kernel behavior
        run: bun run proof:dist
      - name: Test Windows type-checker regression
        if: runner.os == 'Windows'
        run: bunx vitest run tests/type-checker.test.ts
      - name: Affected tests
        env:
          # Pull requests compare against the target branch; pushes compare
          # against the tip they replaced. An unusable base selects nothing.
          PI_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:affected
      - name: Platform smoke floor
        # Curated cross-platform surface (path and executable resolution, native
        # binaries, spawn, process and watcher fallbacks) so a Linux or Windows
        # break surfaces even when the affected selection is empty.
        run: bun run test:smoke
