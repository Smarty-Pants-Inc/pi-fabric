name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'refactor/sd-6477-**', 'feat/sd-6477-**']

permissions:
  contents: read

jobs:
  check:
    # Real-broker suites belong to nats-state-conformance and nats-auth, not the
    # generic affected/smoke selection on either platform. Scope this to check
    # so the dedicated jobs keep their broker-required gates and explicit lists.
    env:
      FABRIC_TEST_SKIP_NATS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          # The affected-test selection diffs the push range or the pull-request
          # base, so that base commit has to be present in history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install runtime prerequisites
        # pi's grep tool downloads rg on first use when it is absent; on shared
        # runners that ad-hoc GitHub Releases download is rate-limited, so
        # provision rg on PATH up front to keep nested-grep tests hermetic.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Non-login Git Bash children warn on stderr when its /tmp is absent.
            # Keep command output deterministic without stripping real warnings.
            mkdir -p /tmp
            choco install ripgrep -y --no-progress
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep bubblewrap python3
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Bend proof compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.36/bend-2.0.36-linux-x64.tar.gz
          echo "02089dc0eed0fd5fd6d73c74cc9cffcb2c6638dd3b02ae83f7b8cc57fbe381ba  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
      - name: Check proofs, reproduce executable kernels, and reject invalid mutations
        if: runner.os == 'Linux'
        env:
          BEND_NO_TELEMETRY: '1'
        run: bun run proof:check
      - name: Type check
        run: bun run typecheck
      # smarty-dev#8121: one exact compiler for the static native helpers (native/toolchain.json). The build
      # requires it on Linux and fails unless both helpers equal the expected sha256 for that toolchain.
      - name: Fetch the pinned native toolchain
        if: runner.os == 'Linux'
        run: node scripts/native-toolchain.mjs fetch
      # smarty-dev#7858: the Windows verified-removal helper is built here by the pinned Windows zig (native/toolchain.json
      # zig.x86_64-windows); the build requires its bytes to equal expected.windows, the same as the Linux cross-build.
      - name: Fetch the pinned zig for the Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'zig zip sha256 mismatch' }
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
          "FABRIC_WIN_ZIG=$(Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0\zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Some integration tests execute the published worker entrypoints in dist.
      - name: Build
        env:
          FABRIC_NATIVE_CC_PINNED: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bun run build
      # Pi installs packages without peer or dev dependencies; the agent and memory
      # workers run outside Pi's module aliases, so their imports must resolve there.
      - name: Package install smoke (no peers, as pi install)
        if: runner.os == 'Linux'
        run: bun run smoke:package-install
      - name: Check CI workflow runtime configuration
        run: bunx vitest run tests/ci-workflows.test.ts
      - name: Check Python kernel diagnostics
        run: bunx vitest run tests/kernel-errors.test.ts
      - name: Test verified-kernel ABI and provider dispatch on both platforms
        run: bunx vitest run tests/verified-kernels.test.ts tests/verified-resources.test.ts tests/verified-providers.test.ts tests/verified-authority.test.ts tests/verified-lifecycle.test.ts tests/verified-storage.test.ts tests/verified-artifact.test.ts
      - name: Check bundled verified-kernel behavior
        run: bun run proof:dist
      - name: Test Windows type-checker regression
        if: runner.os == 'Windows'
        run: bunx vitest run tests/type-checker.test.ts
      - name: Launcher and Pi host regressions
        run: bunx vitest run tests/worker-e2e.test.ts tests/pi-binary.test.ts tests/script-runtime.test.ts tests/herdr-transport.test.ts tests/prewalk-handoff.test.ts tests/shell-middleware.test.ts
      - name: Real Pi provider-dead path (smarty-dev#8742)
        # A real Pi process (RPC mode) loads the built dist/ and talks to a local stub provider.
        if: runner.os == 'Linux'
        env:
          FABRIC_8742_REAL_PI: '1'
        run: bunx vitest run tests/main-provider-dead-real-pi.test.ts
      - name: Real Pi extension-hidden tools (smarty-dev#5492)
        # A real Pi process (RPC mode) loads the built dist/ and a fixture extension that hides three of its
        # tools through pi.setActiveTools; fabric_exec's catalog, the prompt roster and invocation must agree.
        if: runner.os == 'Linux'
        env:
          FABRIC_5492_REAL_PI: '1'
        run: bunx vitest run tests/extension-hidden-tools-real-pi.test.ts
      - name: Real Pi sender headers (smarty-dev#6207)
        # A real Pi process (RPC mode) loads the built dist/; a Main request and its process child's request
        # reach a local stub that records the HTTP headers: X-Smarty-* on the wire, once, never caller-set.
        if: runner.os == 'Linux'
        env:
          FABRIC_6207_REAL_PI: '1'
        run: bunx vitest run tests/sender-headers-real-pi.test.ts
      # smarty-dev#8953: agents.processSlice runs workers in systemd --user scopes. GitHub-hosted ubuntu boots
      # systemd as PID 1 but starts no user manager for the runner: linger starts one, with its session bus.
      - name: Start a user systemd manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for _ in $(seq 1 150); do [ -S "$bus" ] && break; sleep 0.2; done
          test -S "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$bus" >> "$GITHUB_ENV"
      - name: Process-slice scope E2E (required on Linux)
        if: runner.os == 'Linux'
        env:
          FABRIC_SCOPE_E2E_REQUIRED: "1"
        run: bunx vitest run --project scope-e2e
      - name: Affected tests
        env:
          # Pull requests compare against the target branch; pushes compare
          # against the tip they replaced. An unusable base selects nothing.
          PI_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:affected
      - name: Platform smoke floor
        # Curated cross-platform surface (path and executable resolution, native
        # binaries, spawn, process and watcher fallbacks) so a Linux or Windows
        # break surfaces even when the affected selection is empty.
        run: bun run test:smoke
      - name: Package tested Linux runtime
        if: runner.os == 'Linux' && github.event_name == 'push'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/fabric-runtime"
          output="$RUNNER_TEMP/fabric-artifact"
          mkdir -p "$stage" "$output"
          git archive HEAD | tar -x -C "$stage"
          cp -a dist node_modules "$stage/"
          git rev-parse HEAD > "$output/COMMIT"
          git rev-parse HEAD^{tree} > "$output/TREE"
          node --version > "$output/NODE-VERSION"
          bun --version > "$output/BUN-VERSION"
          tar -czf "$output/fabric-runtime.tar.gz" -C "$stage" .
          (cd "$output" && sha256sum fabric-runtime.tar.gz > SHA256SUMS)
      # smarty-dev#8467: the compiled bundle in a real Pi process leaves no mesh state temp or
      # lock staging entry behind when it ends during a large write loop on a busy mesh: a normal
      # exit, SIGTERM, and SIGKILL (whose staged temp the next start on the same root reaps)
      # (pi-fabric#606). It runs the Pi pinned in devDependencies, installed above by
      # `bun install --frozen-lockfile`, against the dist/ built above, placed like the real-Pi
      # two-reload gate (smarty-dev#8382): after the runtime is packaged, so the earlier steps and
      # the recorded NODE-VERSION keep the runner's Node, and before the upload, so only a runtime
      # that passed it is uploaded. Pi 0.87 needs Node >= 22.19 and dist/ is built for node24.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: Real Pi exit cleanup e2e (smarty-dev#8467)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          FABRIC_8467_REAL_PI: '1'
        run: bunx vitest run tests/mesh-exit-cleanup-real-pi.e2e.test.ts
      - name: Upload tested Linux runtime
        if: runner.os == 'Linux' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fabric-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/fabric-artifact/
          if-no-files-found: error
          retention-days: 7

  nats-state-conformance:
    # The StateBackend contract suites on a real nats-server (smarty-dev#7504 phase 2): JetStream with
    # sync_interval always (the backend refuses a server that does not fsync every write) and an http
    # monitor port (read for /varz). NATS_SERVER_REQUIRED=1 fails the job if the server is missing, so it
    # never passes by skipping. Separate from `check`; not a required check.
    # smarty-dev#11373: the same three suites run against both NATS_STATE_PROFILE values. `single` is one server;
    # `cluster` is three routed loopback nodes (replicas 3). NATS_SERVER_URL/NATS_MONITOR_URL stay the single seed
    # inputs; the profile only selects the replica count the test helper writes into the private fixture config.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [single, cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned NATS server
        # The same pinned download as the JetStream event-log job (feat/nats-event-log).
        shell: bash
        run: |
          version=2.14.7
          archive="nats-server-v${version}-linux-amd64.tar.gz"
          release="https://github.com/nats-io/nats-server/releases/download/v${version}"
          stage="$RUNNER_TEMP/nats-release"
          mkdir -p "$stage"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$stage/SHA256SUMS" "$release/SHA256SUMS"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$stage/$archive" "$release/$archive"
          (
            cd "$stage"
            awk -v archive="$archive" '$2 == archive { print }' SHA256SUMS | sha256sum --check --strict -
            # Also bind the release asset to the locally qualified v2.14.7 bytes.
            printf 'e5c20b1cb2c0566b54c544312e91e011f9e130c5c80f16a14f4cf28ef30b8be2  %s\n' "$archive" | sha256sum --check --strict -
            tar -xzf "$archive"
          )
          echo "NATS_BIN=$stage/nats-server-v${version}-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: Start nats-server ${{ matrix.profile }} (loopback, JetStream sync always, monitor ports)
        shell: bash
        env:
          NATS_STATE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          case "$NATS_STATE_PROFILE" in
            single) nodes=1 ;;
            cluster) nodes=3 ;;
            *) echo "unknown NATS profile: $NATS_STATE_PROFILE" >&2; exit 1 ;;
          esac
          for i in $(seq 1 "$nodes"); do
            store="$RUNNER_TEMP/nats-store-$i"
            mkdir -p "$store"
            conf="$RUNNER_TEMP/nats-$i.conf"
            {
              printf 'server_name: n%s\nlisten: 127.0.0.1:%s\nhttp: 127.0.0.1:%s\n' "$i" $((4221 + i)) $((8221 + i))
              printf 'jetstream {\n  store_dir: "%s"\n  sync_interval: always\n}\n' "$store"
              if [ "$nodes" -gt 1 ]; then
                routes=""
                for j in $(seq 1 "$nodes"); do
                  [ "$j" -eq "$i" ] || routes="${routes:+$routes, }nats-route://127.0.0.1:$((6221 + j))"
                done
                printf 'cluster {\n  name: fabric-state-ci\n  listen: 127.0.0.1:%s\n  routes: [%s]\n}\n' $((6221 + i)) "$routes"
              fi
            } > "$conf"
            nohup "$NATS_BIN" -c "$conf" > "$RUNNER_TEMP/nats-$i.log" 2>&1 &
          done
          # Shared bounded readiness: the CLI performs one absolute 60 s gate with
          # 200 ms monitor polling, full and JS-only health, syncAlways, identities,
          # distinct peer routes, and current/online JetStream metadata replicas.
          # It prints every per-node response and derived failure before this step exits.
          monitors=()
          for i in $(seq 1 "$nodes"); do
            monitors+=("n$i=http://127.0.0.1:$((8221 + i))")
          done
          node scripts/nats-cluster-readiness.mjs "${monitors[@]}"
      - name: StateBackend conformance on nats (${{ matrix.profile }})
        env:
          NATS_SERVER_REQUIRED: '1'
          NATS_STATE_PROFILE: ${{ matrix.profile }}
          NATS_SERVER_URL: nats://127.0.0.1:4222
          NATS_MONITOR_URL: http://127.0.0.1:8222
        run: bunx vitest run --retry=0 tests/mesh-state-backend.test.ts tests/mesh-state-backend-multiprocess.test.ts tests/mesh-backend-migration-nats.test.ts
      - name: State backend through a forced metadata-leader election
        if: matrix.profile == 'cluster'
        # The fixture owns another three-node cluster on unique ports, so only its own leader is paused.
        run: bunx vitest run --retry=0 tests/state-backend-nats-election.test.ts
      - name: Server logs (all nodes)
        if: failure()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP"/nats-*.log; do
            [ -e "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

  mesh-lock-bench:
    # The mesh lock benchmark ratchet (smarty-dev#6676, docs/mesh-lock-bench.md): fails a >10%
    # regression of the deterministic per-op lock metrics against bench/mesh-lock-baseline.json.
    # Timing metrics are reported only: on a shared runner they swing by tens of percent.
    # Not a required check (.mergify.yml requires `check (ubuntu-latest)` only).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The benchmark runs dist/ (built for node24) in node worker processes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch the pinned native toolchain
        run: node scripts/native-toolchain.mjs fetch
      - name: Build
        env:
          FABRIC_NATIVE_CC_PINNED: "1"
        run: bun run build
      - name: Mesh lock benchmark ratchet
        # The table (ratchet, timing and report rows) goes to stderr; the JSON result to the file.
        run: bun run bench:mesh-lock:check --out mesh-lock.json > /dev/null
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mesh-lock-bench-${{ github.sha }}
          path: mesh-lock.json
          if-no-files-found: warn
          retention-days: 14

  idle-wakes:
    # The idle wake gate (smarty-dev#7978, R-no-polling; docs/idle-wake-gate.md): an idle activated Pi Main and an
    # idle Fabric resident host, 300 s each in parallel after a 30 s warm-up. Breach: > 1.0 timer wakes/s in total,
    # or one callsite firing more than once a minute. Report-only while IDLE_WAKE_ENFORCE is 0: set it to 1 to block.
    # Not a required check. Wall time ~8 min: install + build ~2 min, self-test ~70 s, both modes ~6 min.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IDLE_WAKE_ENFORCE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch the pinned native toolchain
        run: node scripts/native-toolchain.mjs fetch
      - name: Build
        env:
          FABRIC_NATIVE_CC_PINNED: "1"
        run: bun run build
      - name: Gate self-test
        run: bunx vitest run tests/idle-wake-gate.test.ts
      - name: Idle wakes, Main and resident host (300 s each, in parallel)
        shell: bash
        run: |
          # The 24G cap where a user systemd works (a hosted runner has systemd-run but often no user bus).
          cap=(systemd-run --user --scope -q -p MemoryMax=24G -p MemorySwapMax=0 --)
          command -v systemd-run > /dev/null && "${cap[@]}" true 2> /dev/null || cap=()
          status=0
          for mode in main resident; do
            "${cap[@]}" node scripts/benchmark-idle-cpu.mjs --mode "$mode" --out "idle-wakes-$mode.json" > "idle-wakes-$mode.log" 2>&1 &
          done
          for job in $(jobs -p); do wait "$job" || status=$(( $? > status ? $? : status )); done
          cat idle-wakes-*.log
          # 1 is a breach; anything else is a broken gate and always fails.
          [ "$status" -eq 0 ] || { [ "$status" -eq 1 ] && [ "$IDLE_WAKE_ENFORCE" != 1 ]; }
      - name: Upload idle wake report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: idle-wakes-${{ github.sha }}
          path: idle-wakes-*
          if-no-files-found: warn
          retention-days: 14

  nats-auth:
    # Hosted smarty-dev#7504 T2 role matrix and configured 1/1 T8 auth slice; this does not claim init --local or adapter coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned NATS server
        # The same pinned download as the JetStream event-log job (feat/nats-event-log).
        shell: bash
        run: |
          version=2.14.7
          archive="nats-server-v${version}-linux-amd64.tar.gz"
          release="https://github.com/nats-io/nats-server/releases/download/v${version}"
          stage="$RUNNER_TEMP/nats-release"
          mkdir -p "$stage"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$stage/SHA256SUMS" "$release/SHA256SUMS"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$stage/$archive" "$release/$archive"
          (
            cd "$stage"
            awk -v archive="$archive" '$2 == archive { print }' SHA256SUMS | sha256sum --check --strict -
            # Also bind the release asset to the locally qualified v2.14.7 bytes.
            printf 'e5c20b1cb2c0566b54c544312e91e011f9e130c5c80f16a14f4cf28ef30b8be2  %s\n' "$archive" | sha256sum --check --strict -
            tar -xzf "$archive"
          )
          echo "NATS_BIN=$stage/nats-server-v${version}-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: Hosted authenticated NATS T2/T8 and Path B grants (source CLI)
        env:
          NATS_AUTH_REQUIRED: '1'
        run: bunx vitest run tests/nats-auth-server.test.ts tests/nats-auth-path-b-*.test.ts tests/nats-messaging.test.ts tests/nats-transport-auth.test.ts tests/nats-inbox-faults.test.ts tests/nats-kv-watch.test.ts tests/nats-dead-letter.test.ts --retry=0
