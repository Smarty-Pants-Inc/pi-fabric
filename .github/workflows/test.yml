name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          # The affected-test selection diffs the push range or the pull-request
          # base, so that base commit has to be present in history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install runtime prerequisites
        # pi's grep tool downloads rg on first use when it is absent; on shared
        # runners that ad-hoc GitHub Releases download is rate-limited, so
        # provision rg on PATH up front to keep nested-grep tests hermetic.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep bubblewrap python3
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Bend proof compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.26/bend-2.0.26-linux-x64.tar.gz
          echo "5edcc8e5c12d525655431ab02659ddf88e362aafbe7c7bb7f783a1ffaeb6165c  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
      - name: Check proofs, reproduce executable kernels, and reject invalid mutations
        if: runner.os == 'Linux'
        env:
          BEND_NO_TELEMETRY: '1'
        run: bun run proof:check
      - name: Type check
        run: bun run typecheck
      # Some integration tests execute the published worker entrypoints in dist.
      - name: Build
        run: bun run build
      # Pi installs packages without peer or dev dependencies; the agent and memory
      # workers run outside Pi's module aliases, so their imports must resolve there.
      - name: Package install smoke (no peers, as pi install)
        if: runner.os == 'Linux'
        run: bun run smoke:package-install
      - name: Test verified-kernel ABI and provider dispatch on both platforms
        run: bunx vitest run tests/verified-kernels.test.ts tests/verified-resources.test.ts tests/verified-providers.test.ts tests/verified-authority.test.ts tests/verified-lifecycle.test.ts tests/verified-storage.test.ts tests/verified-artifact.test.ts
      - name: Check bundled verified-kernel behavior
        run: bun run proof:dist
      - name: Test Windows type-checker regression
        if: runner.os == 'Windows'
        run: bunx vitest run tests/type-checker.test.ts
      - name: Launcher and Pi host regressions
        run: bunx vitest run tests/worker-e2e.test.ts tests/pi-binary.test.ts tests/script-runtime.test.ts tests/herdr-transport.test.ts tests/prewalk-handoff.test.ts tests/shell-middleware.test.ts
      - name: Affected tests
        env:
          # Pull requests compare against the target branch; pushes compare
          # against the tip they replaced. An unusable base selects nothing.
          PI_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:affected
      - name: Platform smoke floor
        # Curated cross-platform surface (path and executable resolution, native
        # binaries, spawn, process and watcher fallbacks) so a Linux or Windows
        # break surfaces even when the affected selection is empty.
        run: bun run test:smoke
      - name: Package tested Linux runtime
        if: runner.os == 'Linux' && github.event_name == 'push'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/fabric-runtime"
          output="$RUNNER_TEMP/fabric-artifact"
          mkdir -p "$stage" "$output"
          git archive HEAD | tar -x -C "$stage"
          cp -a dist node_modules "$stage/"
          git rev-parse HEAD > "$output/COMMIT"
          git rev-parse HEAD^{tree} > "$output/TREE"
          node --version > "$output/NODE-VERSION"
          bun --version > "$output/BUN-VERSION"
          tar -czf "$output/fabric-runtime.tar.gz" -C "$stage" .
          (cd "$output" && sha256sum fabric-runtime.tar.gz > SHA256SUMS)
      - name: Upload tested Linux runtime
        if: runner.os == 'Linux' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fabric-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/fabric-artifact/
          if-no-files-found: error
          retention-days: 7
