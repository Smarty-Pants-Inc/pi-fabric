merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always

# smarty-dev's plain rule (smarty-dev#865): the PR, its required checks and this queue are the
# review. The Astra reviewer queues a ready PR after its success verdict; `hold` and DO NOT LAND
# titles keep a PR out. Both lists stay equal, so Mergify checks an up-to-date PR in place
# (smarty-dev#455) instead of rebuilding a draft.
queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 30 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      - check-success = check (ubuntu-latest)
      - check-success = check (windows-latest)
      - or:
          - check-success = review/security
          - and:
              - -head ~= ^sync/upstream-
              - -label = needs-security-pass
    merge_conditions:
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      - check-success = check (ubuntu-latest)
      - check-success = check (windows-latest)
      - or:
          - check-success = review/security
          - and:
              - -head ~= ^sync/upstream-
              - -label = needs-security-pass

# GitHub suspended smarty-agents (2026-09-25); the review agent queues as the write App's bot,
# which has no collaborator permission (smarty-dev#562). Humans with write access still can.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
