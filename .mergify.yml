merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always

queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 30 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - check-success = smarty-review
      - check-success = review/astra
      - check-success = smarty-land-ready
      - check-success = check (ubuntu-latest)
      - check-success = check (windows-latest)
    merge_conditions:
      - base = main
      - -draft
      - check-success = smarty-review
      - check-success = review/astra
      - check-success = smarty-land-ready
      - check-success = check (ubuntu-latest)
      - check-success = check (windows-latest)
