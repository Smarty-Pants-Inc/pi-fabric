# Follow smarty-dev's .mergify.yml auto-queue pattern for ready PRs.
# `hold` is the opt-out; every queue keeps the same required checks.
merge_protections_settings:
  auto_merge_conditions: true

merge_queue:
  mode: serial
  # Two speculative batches at once (chief-of-staff GO 10-12 01:42Z): a bisect or a slow batch no longer
  # blocks the whole line (10-11 23:54Z-02:00Z: one #864 bisect held every PR, P0 pi-fabric#936 included).
  # Revert to 1 if queue-draft resets rise or CI runners can't carry two batches.
  max_parallel_checks: 2
  # Skip intermediate batch results for anti-flake protection; https://docs.mergify.com/merge-queue/batches/#skip-intermediate-results-anti-flake-protection; Paul 10-17 17:55Z via chief-of-staff (turn on Mergify features), smarty-dev#14537
  skip_intermediate_results: true
  reset_on_external_merge: always

# smarty-dev's plain rule (smarty-dev#865): the PR, its required checks and this queue are the
# review. Mergify queues a ready PR once queue_conditions pass; `hold` and DO NOT LAND
# titles keep a PR out. merge_conditions recheck CI and opt-out vetoes on the updated head
# (smarty-dev#2974), but review statuses only refuse failed reviews: queue updates create
# a new head with no review statuses (smarty-dev#455).
queue_rules:
  - name: default
    # ponytail: one Ubuntu+Windows run takes ~30 min under fleet load, so a serial queue of N PRs takes N
    # half-hours (7 queued on 10-02 = 3.5 h). Batching tests up to 4 queued PRs in one CI run; Mergify
    # bisects a failing batch. smarty-dev batches the same way (smarty-dev#2083).
    batch_size: 4
    batch_max_wait_time: 2 min
    # ponytail: above the fleet CI-wait p95 (151 min, 10-09); a lower value dequeued green PRs mid-run (smarty-dev#8527). Lower once queue-draft p95 < 60 min.
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - -label ~= (?i)^(hold|do[ -]?not[ -]?merge|dnm|freeze|frozen)$
      - -label ~= (?i)^(wip|work[ -]?in[ -]?progress|do[ -]?not[ -]?land|never[ -]?land)$
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      - -check-failure = review/security  # a failed security verdict refuses admission, label or not
      - check-success = check (ubuntu-latest)
      - or:
          - check-success = review/security
          - and:
              # Upstream syncs (sync/upstream-*) queue like any PR; review/security runs after merge within 24 h (R-no-security-slips, smarty-dev#2264).
              - -label = needs-security-pass
    merge_conditions:
      # Label and title opt-outs added after queueing stop the merge.
      # Review statuses here only refuse a FAILED review: an in-place or batch update
      # makes a new head with no review statuses (smarty-dev#455).
      # queue_conditions require the reviews on the reviewed head.
      - -check-failure = review/astra
      - -label ~= (?i)^(hold|do[ -]?not[ -]?merge|dnm|freeze|frozen)$
      - -label ~= (?i)^(wip|work[ -]?in[ -]?progress|do[ -]?not[ -]?land|never[ -]?land)$
      - base = main
      - -label = hold
      - -title ~= (?i)do not land
      - -check-failure = review/security
      - check-success = check (ubuntu-latest)

# Queue order (smarty-dev#6477, Paul 10-08: the SQLite store is the fleet's top priority and gets the merge
# queue's top tier). A fleet-top PR is queued ahead of p0, and a p0 PR ahead of the rest. Neither interrupts a
# batch already in CI (smarty-dev#2143). It still needs every queue and merge condition above.
priority_rules:
  - name: fleet-top
    conditions:
      - label = fleet-top
    priority: 4000
    allow_checks_interruption: false
  - name: p0
    conditions:
      - label = p0
    priority: high
    allow_checks_interruption: false

# GitHub suspended smarty-agents (2026-09-25); the review agent queues as the write App's bot,
# which has no collaborator permission (smarty-dev#562). Humans with write access still can.
# This block is the fleet template (smarty-dev#1513), copied from smarty-dev's .mergify.yml.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
  # The same allowance for `requeue` (smarty-dev#7327): without it Mergify refuses a fleet bot's requeue
  # ('Command disallowed'), and a dequeued PR sits until someone notices (k3#958, ~18.5 h on 10-08).
  requeue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
  # smarty-land's emergency dequeue posts as the actor that queued, the write App bot on the fleet host.
  dequeue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
  # The stuck-work check's R4 posts one `@mergifyio refresh` per head as the write App (smarty-dev#868);
  # without this Mergify answers "Command disallowed" (#251 F278).
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
