# Leaf has NO JetStream: no accidental local R1 stream / divergent KV authority.
server_name: "leaf-m5"
listen: "127.0.0.1:4222"
http: "127.0.0.1:8222"
max_payload: 262144
max_pending: 8388608
max_connections: 512
write_deadline: "5s"
ping_interval: "20s"
ping_max: 3
lame_duck_duration: "30s"
lame_duck_grace_period: "10s"
tls: {
    cert_file: "/home/paul/.local/state/smarty/nats/tls/server-m5.pem"
    key_file: "/home/paul/.local/state/smarty/nats/tls/server-m5.key"
    ca_file: "/home/paul/.local/state/smarty/nats/tls/transport-ca.pem"
    verify: true
    timeout: 5
    min_version: "1.3"
    verify_and_map: true
  }
accounts: {
  "FABRIC": {
    "users": [
      {
        "user": "fabric.m5",
        "permissions": {
          "publish": {
            "allow": [
              "fabric.root.m5.>",
              "fabric.fleet.work.m5.>",
              "fabric.fleet.presence.m5.>",
              "fabric.fleet.request.m5.>",
              "$KV.STATE_m5.>",
              "$JS.fleet.API.$KV.STATE_m5.>",
              "_INBOX.m5.>",
              "$JS.fleet.API.STREAM.INFO.ROOT_m5",
              "$JS.fleet.API.STREAM.MSG.GET.ROOT_m5",
              "$JS.fleet.API.CONSUMER.INFO.ROOT_m5.>",
              "$JS.fleet.API.CONSUMER.MSG.NEXT.ROOT_m5.>",
              "$JS.API.STREAM.INFO.ROOT_m5",
              "$JS.API.STREAM.MSG.GET.ROOT_m5",
              "$JS.API.CONSUMER.INFO.ROOT_m5.>",
              "$JS.API.CONSUMER.MSG.NEXT.ROOT_m5.>",
              "$JS.ACK.ROOT_m5.>",
              "$JS.ACK.fleet.*.ROOT_m5.>",
              "$JS.fleet.API.STREAM.INFO.KV_STATE_m5",
              "$JS.fleet.API.STREAM.MSG.GET.KV_STATE_m5",
              "$JS.fleet.API.CONSUMER.INFO.KV_STATE_m5.>",
              "$JS.fleet.API.CONSUMER.MSG.NEXT.KV_STATE_m5.>",
              "$JS.API.STREAM.INFO.KV_STATE_m5",
              "$JS.API.STREAM.MSG.GET.KV_STATE_m5",
              "$JS.API.CONSUMER.INFO.KV_STATE_m5.>",
              "$JS.API.CONSUMER.MSG.NEXT.KV_STATE_m5.>",
              "$JS.ACK.KV_STATE_m5.>",
              "$JS.ACK.fleet.*.KV_STATE_m5.>"
            ]
          },
          "subscribe": {
            "allow": [
              "fabric.root.m5.>",
              "fabric.fleet.work.>",
              "fabric.fleet.presence.>",
              "fabric.hub.delivery.m5.>",
              "$KV.STATE_m5.>",
              "_INBOX.m5.>"
            ]
          }
        }
      }
    ]
  }
}
leafnodes {
  reconnect: "2s"
  remotes: [{
    urls: ["tls://100.78.221.70:7422", "tls://100.103.29.1:7422", "tls://100.105.145.68:7422"]
    account: "FABRIC"
    tls: {
    cert_file: "/home/paul/.local/state/smarty/nats/tls/leaf-m5.pem"
    key_file: "/home/paul/.local/state/smarty/nats/tls/leaf-m5.key"
    ca_file: "/home/paul/.local/state/smarty/nats/tls/transport-ca.pem"
    verify: true
    timeout: 5
    min_version: "1.3"
  }
  }]
}
